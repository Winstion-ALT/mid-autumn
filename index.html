<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const titleEl = document.getElementById('title');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ========== 流动背景 ==========
const bgParticles = [];
const BG_COUNT = 80;
for (let i = 0; i < BG_COUNT; i++) {
  bgParticles.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 2 + 0.5,
    vx: (Math.random() - 0.5) * 0.3,
    vy: -Math.random() * 0.4 - 0.1,
    alpha: Math.random() * 0.5 + 0.2
  });
}

function drawBackground(time) {
  // 渐变夜空
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a0e27');
  grad.addColorStop(0.5, '#1a1f4a');
  grad.addColorStop(1, '#2d1b4e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 流动星云效果
  for (let i = 0; i < 3; i++) {
    const x = W * 0.3 + Math.sin(time * 0.0003 + i * 2) * 200;
    const y = H * 0.6 + Math.cos(time * 0.0002 + i * 1.5) * 100;
    const nebula = ctx.createRadialGradient(x, y, 0, x, y, 300);
    nebula.addColorStop(0, `rgba(${100 + i * 30}, ${80 + i * 20}, ${180 + i * 20}, 0.15)`);
    nebula.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = nebula;
    ctx.fillRect(0, 0, W, H);
  }

  // 背景小星点
  for (const p of bgParticles) {
    p.x += p.vx;
    p.y += p.vy;
    if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
    ctx.fill();
  }
}

// ========== 月亮 ==========
function drawMoon(time) {
  const mx = W - 120;
  const my = 100;
  const mr = 60;

  // 月光晕
  const glow = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 3);
  glow.addColorStop(0, 'rgba(255, 240, 200, 0.4)');
  glow.addColorStop(0.5, 'rgba(255, 220, 150, 0.15)');
  glow.addColorStop(1, 'rgba(255, 200, 100, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(mx - mr * 3, my - mr * 3, mr * 6, mr * 6);

  // 月亮本体
  const moonGrad = ctx.createRadialGradient(mx - 15, my - 15, 5, mx, my, mr);
  moonGrad.addColorStop(0, '#fffbe6');
  moonGrad.addColorStop(0.7, '#ffe8a3');
  moonGrad.addColorStop(1, '#ffd27a');
  ctx.beginPath();
  ctx.arc(mx, my, mr, 0, Math.PI * 2);
  ctx.fillStyle = moonGrad;
  ctx.fill();

  // 月亮表面纹理
  ctx.globalAlpha = 0.15;
  ctx.fillStyle = '#c9a55a';
  ctx.beginPath();
  ctx.arc(mx - 15, my + 10, 12, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(mx + 20, my - 5, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(mx + 5, my + 25, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  // 月亮呼吸效果
  const pulse = Math.sin(time * 0.001) * 0.05 + 1;
  ctx.beginPath();
  ctx.arc(mx, my, mr * pulse, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(255, 240, 200, ${0.3 + Math.sin(time * 0.001) * 0.1})`;
  ctx.lineWidth = 2;
  ctx.stroke();
}

// ========== 雨滴祝福语 ==========
const rainTexts = [
  '中秋快乐', '花好月圆', '阖家团圆', '万事如意',
  '幸福安康', '心想事成', '月圆人圆', '吉祥如意',
  '团团圆圆', '和和美美', '平平安安', '顺顺利利',
  '福星高照', '财运亨通', '步步高升', '前程似锦',
  '月饼香甜', '桂花飘香', '玉兔呈祥', '嫦娥奔月'
];

const rainDrops = [];
const RAIN_COUNT = 25;

function createRainDrop() {
  return {
    x: Math.random() * W,
    y: -50 - Math.random() * 200,
    text: rainTexts[Math.floor(Math.random() * rainTexts.length)],
    speed: Math.random() * 1.5 + 0.8,
    fontSize: Math.random() * 12 + 14,
    alpha: Math.random() * 0.5 + 0.3,
    hue: Math.random() * 40 + 30 // 金黄色系
  };
}

for (let i = 0; i < RAIN_COUNT; i++) {
  const d = createRainDrop();
  d.y = Math.random() * H;
  rainDrops.push(d);
}

function drawRain() {
  for (const d of rainDrops) {
    d.y += d.speed;
    if (d.y > H + 30) {
      Object.assign(d, createRainDrop());
    }
    ctx.save();
    ctx.globalAlpha = d.alpha;
    ctx.font = `bold ${d.fontSize}px "楷体", "KaiTi", serif`;
    ctx.fillStyle = `hsl(${d.hue}, 90%, 70%)`;
    ctx.shadowColor = `hsl(${d.hue}, 100%, 60%)`;
    ctx.shadowBlur = 8;
    ctx.fillText(d.text, d.x, d.y);
    ctx.restore();
  }
}

// ========== 爱心字条 ==========
const wishes = [
  '中秋快乐', '花好月圆', '阖家团圆', '万事如意',
  '幸福安康', '心想事成', '月圆人圆', '吉祥如意',
  '团团圆圆', '和和美美', '平平安安', '顺顺利利',
  '福星高照', '财运亨通', '步步高升', '前程似锦',
  '月饼香甜', '桂花飘香', '玉兔呈祥', '嫦娥奔月',
  '千里婵娟', '天长地久', '岁岁平安', '年年有余',
  '金玉满堂', '喜气洋洋', '笑口常开', '其乐融融',
  '人月两圆', '共赏明月', '思念绵长', '祝福满满'
];

// 爱心参数方程
function heartPoint(t, scale, cx, cy) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
  return { x: cx + x * scale, y: cy + y * scale };
}

const noteCards = [];
const NOTE_COUNT = 60;
let heartPhase = 'forming'; // forming, hold, scattering
let heartTimer = 0;
let formProgress = 0;

// ========== 柔和粒子系统 ==========
const particles = [];

function createExplosion(x, y, count = 25) {
  // 柔和的粒子飘散
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 + 1.5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1.5,
      size: Math.random() * 4 + 2,
      alpha: 1,
      decay: Math.random() * 0.01 + 0.006,
      gravity: 0.03,
      hue: Math.random() * 30 + 35, // 柔和金黄色
      trail: [],
      drift: (Math.random() - 0.5) * 0.02 // 轻微飘动
    });
  }
}

function updateParticles(deltaTime) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    
    // 记录轨迹
    p.trail.push({ x: p.x, y: p.y, alpha: p.alpha });
    if (p.trail.length > 5) p.trail.shift();
    
    p.x += p.vx + Math.sin(p.y * 0.02) * p.drift * 10;
    p.y += p.vy;
    p.vy += p.gravity;
    p.vx *= 0.995;
    p.alpha -= p.decay;
    p.size *= 0.997;
    
    if (p.alpha <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    // 柔和轨迹
    for (let i = 0; i < p.trail.length; i++) {
      const t = p.trail[i];
      const trailAlpha = (i / p.trail.length) * p.alpha * 0.4;
      ctx.beginPath();
      ctx.arc(t.x, t.y, p.size * (i / p.trail.length) * 0.6, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 80%, 75%, ${trailAlpha})`;
      ctx.fill();
    }
    
    // 粒子本体 柔和发光
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue}, 70%, 80%, ${p.alpha})`;
    ctx.shadowColor = `hsla(${p.hue}, 60%, 60%, 0.5)`;
    ctx.shadowBlur = 6;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function initNoteCards() {
  noteCards.length = 0;
  const cx = W / 2;
  const cy = H / 2 + 20;
  const scale = Math.min(W, H) / 55; // 更紧凑

  for (let i = 0; i < NOTE_COUNT; i++) {
    const t = (i / NOTE_COUNT) * Math.PI * 2 - Math.PI / 2;
    const target = heartPoint(t, scale, cx, cy);
    
    // 随机起始位置（从屏幕各处飞入）
    const startX = Math.random() * W;
    const startY = H + 50 + Math.random() * 200;
    
    noteCards.push({
      x: startX,
      y: startY,
      targetX: target.x,
      targetY: target.y,
      startX,
      startY,
      text: wishes[i % wishes.length],
      angle: (Math.random() - 0.5) * 0.3,
      targetAngle: (Math.random() - 0.5) * 0.4,
      delay: i * 0.01 + Math.random() * 0.05,
      width: 60,
      height: 28,
      index: i,
      exploded: false,
      // 散开参数
      scatterVx: 0,
      scatterVy: 0,
      scatterVr: 0,
      scatterAlpha: 1
    });
  }
}

function drawNoteCard(card, alpha = 1) {
  ctx.save();
  ctx.translate(card.x, card.y);
  ctx.rotate(card.angle);
  ctx.globalAlpha = alpha;

  // 字条阴影
  ctx.shadowColor = 'rgba(0,0,0,0.3)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetY = 3;

  // 字条背景（米黄色纸条）
  const w = card.width;
  const h = card.height;
  const grad = ctx.createLinearGradient(-w/2, -h/2, w/2, h/2);
  grad.addColorStop(0, '#fff8e7');
  grad.addColorStop(0.5, '#fff2d0');
  grad.addColorStop(1, '#ffe9b8');
  ctx.fillStyle = grad;
  
  // 圆角矩形
  const r = 4;
  ctx.beginPath();
  ctx.moveTo(-w/2 + r, -h/2);
  ctx.lineTo(w/2 - r, -h/2);
  ctx.quadraticCurveTo(w/2, -h/2, w/2, -h/2 + r);
  ctx.lineTo(w/2, h/2 - r);
  ctx.quadraticCurveTo(w/2, h/2, w/2 - r, h/2);
  ctx.lineTo(-w/2 + r, h/2);
  ctx.quadraticCurveTo(-w/2, h/2, -w/2, h/2 - r);
  ctx.lineTo(-w/2, -h/2 + r);
  ctx.quadraticCurveTo(-w/2, -h/2, -w/2 + r, -h/2);
  ctx.closePath();
  ctx.fill();

  // 字条边框
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#d4a857';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 文字
  ctx.fillStyle = '#8b4513';
  ctx.font = 'bold 13px "楷体", "KaiTi", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(card.text, 0, 0);

  ctx.restore();
}

function updateHeart(deltaTime) {
  if (heartPhase === 'forming') {
    heartTimer += deltaTime;
    formProgress = Math.min(1, heartTimer / 2500); // 2.5秒形成
    
    let allDone = true;
    for (const card of noteCards) {
      const p = Math.max(0, Math.min(1, (formProgress - card.delay) / (1 - card.delay)));
      if (p < 1) allDone = false;
      // easeOutCubic
      const ease = 1 - Math.pow(1 - p, 3);
      card.x = card.startX + (card.targetX - card.startX) * ease;
      card.y = card.startY + (card.targetY - card.startY) * ease;
      card.angle = card.targetAngle * ease;
    }
    
    if (allDone) {
      heartPhase = 'hold';
      heartTimer = 0;
    }
  } else if (heartPhase === 'hold') {
    heartTimer += deltaTime;
    // 轻微呼吸
    for (const card of noteCards) {
      const wobble = Math.sin(heartTimer * 0.002 + card.targetX * 0.01) * 2;
      card.y = card.targetY + wobble;
    }
    if (heartTimer > 2500) {
      heartPhase = 'scattering';
      heartTimer = 0;
      const cx = W / 2;
      const cy = H / 2 + 20;
      for (const card of noteCards) {
        const dx = card.x - cx;
        const dy = card.y - cy;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        // 顺时针旋转散开：切向速度 + 径向速度
        const tangentialSpeed = Math.random() * 3 + 2; // 顺时针切向
        const radialSpeed = Math.random() * 2 + 1;
        // 顺时针切向：( -dy/dist, dx/dist )
        card.scatterVx = (dx / dist) * radialSpeed + (-dy / dist) * tangentialSpeed;
        card.scatterVy = (dy / dist) * radialSpeed + (dx / dist) * tangentialSpeed;
        card.scatterVr = Math.random() * 0.08 + 0.05; // 顺时针旋转
        card.scatterAlpha = 1;
      }
    }
  } else if (heartPhase === 'scattering') {
    heartTimer += deltaTime;
    for (const card of noteCards) {
      card.x += card.scatterVx;
      card.y += card.scatterVy;
      card.scatterVy += 0.1; // 轻微重力
      card.angle += card.scatterVr; // 顺时针旋转
      
      const prevAlpha = card.scatterAlpha;
      card.scatterAlpha = Math.max(0, card.scatterAlpha - 0.01);
      
      // 字条快消失时柔和地散成粒子
      if (prevAlpha > 0.4 && card.scatterAlpha <= 0.4 && !card.exploded) {
        card.exploded = true;
        createExplosion(card.x, card.y, 20);
      }
    }
    
    // 全部消失后重新开始
    if (heartTimer > 2000) {
      heartPhase = 'forming';
      heartTimer = 0;
      formProgress = 0;
      initNoteCards();
    }
  }
}

function drawHeart() {
  for (const card of noteCards) {
    let alpha = 1;
    if (heartPhase === 'scattering') {
      alpha = card.scatterAlpha;
    } else if (heartPhase === 'forming') {
      const p = Math.max(0, Math.min(1, (formProgress - card.delay) / (1 - card.delay)));
      alpha = p;
    }
    if (alpha > 0.01) {
      drawNoteCard(card, alpha);
    }
  }
}

// ========== 主循环 ==========
let lastTime = performance.now();

function animate(currentTime) {
  const deltaTime = currentTime - lastTime;
  lastTime = currentTime;

  drawBackground(currentTime);
  drawMoon(currentTime);
  drawRain();
  updateHeart(deltaTime);
  drawHeart();
  updateParticles(deltaTime);
  drawParticles();

  requestAnimationFrame(animate);
}

// 初始化
initNoteCards();
window.addEventListener('resize', () => {
  resize();
  initNoteCards();
});

// 标题淡入
setTimeout(() => {
  titleEl.classList.add('show');
}, 1000);

// 祝福语淡入
setTimeout(() => {
  document.getElementById('blessing').classList.add('show');
}, 1500);

// 发送按钮淡入
setTimeout(() => {
  document.getElementById('sendBtn').classList.add('show');
}, 2500);

// 音乐控制
const musicBtn = document.getElementById('musicBtn');
const bgMusic = document.getElementById('bgMusic');
let musicPlaying = false;

musicBtn.addEventListener('click', () => {
  if (musicPlaying) {
    bgMusic.pause();
    musicBtn.classList.remove('playing');
    musicPlaying = false;
  } else {
    bgMusic.play().catch(() => {
      // 自动播放被阻止时提示
      alert('点击一下屏幕即可播放音乐哦~');
    });
    musicBtn.classList.add('playing');
    musicPlaying = true;
  }
});

// 第一次点击播放音乐（移动端自动播放限制）
document.addEventListener('touchstart', function firstPlay() {
  if (!musicPlaying) {
    bgMusic.play().catch(() => {});
    musicBtn.classList.add('playing');
    musicPlaying = true;
  }
  document.removeEventListener('touchstart', firstPlay);
}, { passive: true });

// 分享按钮
const sendBtn = document.getElementById('sendBtn');
const shareTip = document.getElementById('shareTip');

sendBtn.addEventListener('click', () => {
  // 判断是否在微信中
  const isWechat = /MicroMessenger/i.test(navigator.userAgent);
  if (isWechat) {
    shareTip.classList.add('show');
  } else {
    // 非微信环境，尝试复制链接或提示
    if (navigator.share) {
      navigator.share({
        title: '中秋快乐 · 阖家团圆',
        text: '送你一轮明月，愿你花好月圆人团圆 🌕',
        url: window.location.href
      });
    } else {
      // 复制链接
      const url = window.location.href;
      const textarea = document.createElement('textarea');
      textarea.value = url;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        alert('链接已复制！快发给你的朋友吧~ 🌕');
      } catch (e) {
        alert('请手动复制网址，发送给朋友哦~');
      }
      document.body.removeChild(textarea);
    }
  }
});

// 点击分享提示关闭
shareTip.addEventListener('click', () => {
  shareTip.classList.remove('show');
});

requestAnimationFrame(animate);
</script>
</body>
</html>
